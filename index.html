<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kyle's World</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <section class="startup-screen" aria-label="Loading Kyle's World">
    <div class="startup-mark" aria-hidden="true">K<span>.</span></div>
    <div class="startup-meta">
      <p>WELCOME TO</p>
      <h2>Loading</h2>
    </div>
    <div class="startup-progress" aria-hidden="true">
      <span></span>
    </div>
    <p class="startup-status">STATUS: CODING <span>///</span> 001</p>
  </section>
  <script src="spinner.js"></script>

  <!-- All content goes here -->
  <div id="all-contents">
    <nav>
      <h1>Kyle Campos</h1>
      <ul id="nav-ul">
        <li class="nav-li"><a href="index.html">Home</a></li>
        <li class="nav-li"><a href="portfolio.html">Portfolio</a></li>
        <li class="nav-li"><a href="Schedule.html">Schedule</a></li>
        <li class="nav-li"><a href="skybound.html">Skybound</a></li>
      </ul>
    </nav>

    <main class="name-display">
      <div class="name-container">
        <div class="letter">K</div>
        <div class="letter">y</div>
        <div class="letter">l</div>
        <div class="letter">e</div>
        <div class="draggable-image" id="draggableImage">
          <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSrlH7vDFxZuIktFbE3MIfYCIXXPOWUqrczWMCCTvXo6xRgAYhbDca-qXQ&s=10" alt="Kyle's image" />
        </div>
      </div>
    </main>
  </div>
  <script>
    (function () {
      var draggableImage = document.getElementById("draggableImage");
      var isDown = false;
      var offset = { x: 0, y: 0 };
      var currentX = 0;
      var currentY = 0;

      draggableImage.addEventListener("mousedown", function (e) {
        isDown = true;
        var rect = draggableImage.getBoundingClientRect();
        offset.x = e.clientX - rect.left;
        offset.y = e.clientY - rect.top;
        draggableImage.style.zIndex = "100";
      });

      document.addEventListener("mousemove", function (e) {
        if (!isDown) return;
        
        var container = document.querySelector(".name-container");
        var containerRect = container.getBoundingClientRect();
        
        currentX = e.clientX - containerRect.left - offset.x;
        currentY = e.clientY - containerRect.top - offset.y;
        
        draggableImage.style.transform = "translate(" + currentX + "px, " + currentY + "px)";
      });

      document.addEventListener("mouseup", function () {
        isDown = false;
        draggableImage.style.zIndex = "10";
      });

      // Touch support for mobile
      draggableImage.addEventListener("touchstart", function (e) {
        isDown = true;
        var rect = draggableImage.getBoundingClientRect();
        var touch = e.touches[0];
        offset.x = touch.clientX - rect.left;
        offset.y = touch.clientY - rect.top;
        draggableImage.style.zIndex = "100";
      });

      document.addEventListener("touchmove", function (e) {
        if (!isDown) return;
        
        var container = document.querySelector(".name-container");
        var containerRect = container.getBoundingClientRect();
        var touch = e.touches[0];
        
        currentX = touch.clientX - containerRect.left - offset.x;
        currentY = touch.clientY - containerRect.top - offset.y;
        
        draggableImage.style.transform = "translate(" + currentX + "px, " + currentY + "px)";
      });

      document.addEventListener("touchend", function () {
        isDown = false;
        draggableImage.style.zIndex = "10";
      });
    }());
  </script>
</body>

</html>
