  <!-- Hide Loading Screen Script -->
  <script>
    window.addEventListener("load", () => {
      const loader = document.getElementById("startupScreen");
      if (loader) {
        setTimeout(() => {
          loader.style.opacity = "0";
          loader.style.transition = "opacity 0.5s ease";
          setTimeout(() => loader.style.display = "none", 500);
        }, 1200); // Adjust display duration (in ms) if desired
      }
    });
  </script>
