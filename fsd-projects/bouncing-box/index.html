<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bouncing Box</title>
  <script src="jquery.min.js"></script>
  <style>
    :root {
      color-scheme: light;
      --page-background: #f4f1ea;
      --page-text: #18211c;
      --button-background: #18211c;
      --button-text: #f4f1ea;
    }

    body.dark-mode {
      color-scheme: dark;
      --page-background: #18211c;
      --page-text: #f4f1ea;
      --button-background: #c7f36b;
      --button-text: #18211c;
    }

    body {
      margin: 0;
      overflow: hidden;
      background: var(--page-background);
      color: var(--page-text);
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    .theme-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 2;
      padding: 10px 14px;
      border: 1px solid var(--page-text);
      border-radius: 999px;
      background: var(--button-background);
      color: var(--button-text);
      cursor: pointer;
      font: 700 0.75rem/1 "Helvetica Neue", Arial, sans-serif;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .theme-toggle:focus-visible {
      outline: 3px solid #ff785f;
      outline-offset: 3px;
    }

    .box {
      width: 70px;
      height: 70px;
      background-color: teal;
      font-size: 300%;
      text-align: center;
      user-select: none;
      display: block;
      position: absolute;
      top: 100px;
      /* Change me! */
      left: 0px;
    }

    .board {
      height: 100vh;
    }
  </style>
  <!-- 	<script src="//cdnjs.cloudflare.com/ajax/libs/jquery/2.1.1/jquery.min.js"></script> -->
</head>

<body class="board">
  <button class="theme-toggle" type="button" aria-pressed="false">
    Dark mode
  </button>

  <!-- HTML for the box -->
  <div class="box">?</div>

  <script>
    (function () {
      "use strict";
      /* global jQuery */

      //////////////////////////////////////////////////////////////////
      /////////////////// SETUP DO NOT DELETE //////////////////////////
      //////////////////////////////////////////////////////////////////

      var box = jQuery(".box"); // reference to the HTML .box element
      var board = jQuery(".board"); // reference to the HTML .board element
      var themeToggle = jQuery(".theme-toggle");
      var boardWidth = board.width(); // the maximum X-Coordinate of the screen

      function setDarkMode(isDark) {
        jQuery("body").toggleClass("dark-mode", isDark);
        themeToggle.attr("aria-pressed", isDark ? "true" : "false");
        themeToggle.text(isDark ? "Light mode" : "Dark mode");
        localStorage.setItem("bouncing-box-dark-mode", isDark ? "true" : "false");
      }

      var savedTheme = localStorage.getItem("bouncing-box-dark-mode");
      setDarkMode(savedTheme === "true");
      themeToggle.on("click", function () {
        setDarkMode(!jQuery("body").hasClass("dark-mode"));
      });

      // update the boardWidth variable when the window is resized
      jQuery(window).on("resize", function () {
        boardWidth = board.width();
      });

      // Every 50 milliseconds, call the update Function (see below)
      setInterval(update, 50);

      // Every time the box is clicked, call the handleBoxClick Function (see below)
      box.on("click", handleBoxClick);

      // moves the Box to a new position on the screen along the X-Axis
      function moveBoxTo(newPositionX) {
        box.css("left", newPositionX);
      }

      // changes the text displayed on the Box
      function changeBoxText(newText) {
        box.text(newText);
      }

      //////////////////////////////////////////////////////////////////
      /////////////////// YOUR CODE BELOW HERE /////////////////////////
      //////////////////////////////////////////////////////////////////

      // TODO 2 - Variable declarations
      var positionX = 0;
      var points = 0;
      var speed = 10;
      var direction = 1;


      /**
       * This Function will be called 20 times/second.
       * Each time it is called, it should move the Box to a new location.
       * If the box drifts off the screen, turn it around!
       */
      function update() {
        positionX = positionX + speed * direction;

        if (positionX >= boardWidth - box.width()) {
          positionX = boardWidth - box.width();
          direction = -1;
        } else if (positionX <= 0) {
          positionX = 0;
          direction = 1;
        }

        moveBoxTo(positionX);
      }

      /**
       * This Function will be called each time the box is clicked.
       * Each time it is called, it should perform each of the following actions:
       * - increase the points total
       * - increase the speed
       * - move the box to the left side of the screen.
       */
      function handleBoxClick() {
        points = points + 1;
        speed = 3 * points + 10;
        positionX = 0;
        direction = 1;
        changeBoxText(points);
        moveBoxTo(positionX);

      }



    })();
  </script>
</body>

</html>
